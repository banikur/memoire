<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <mask id="hole4">
      <rect width="800" height="600" fill="white"/>
      <rect x="48" y="48" width="704" height="504" fill="black"/>
    </mask>
  </defs>
  <!-- Stone background -->
  <rect width="800" height="600" fill="#e8e0d5" mask="url(#hole4)"/>
  <!-- Inner border double line -->
  <rect x="44" y="44" width="712" height="512"
    fill="none" stroke="#b5a898" stroke-width="1.5"/>
  <rect x="52" y="52" width="696" height="496"
    fill="none" stroke="#b5a898" stroke-width="1" stroke-dasharray="6 3"/>
  <!-- Outer border -->
  <rect x="4" y="4" width="792" height="592" fill="none" stroke="#c4b8a8" stroke-width="4" rx="3"/>
  <!-- Corner leaf accents (simple) -->
  <ellipse cx="28" cy="28" rx="14" ry="7" fill="#8a9e7a" opacity="0.7" transform="rotate(-45 28 28)"/>
  <ellipse cx="772" cy="28" rx="14" ry="7" fill="#8a9e7a" opacity="0.7" transform="rotate(45 772 28)"/>
  <ellipse cx="28" cy="572" rx="14" ry="7" fill="#8a9e7a" opacity="0.7" transform="rotate(45 28 572)"/>
  <ellipse cx="772" cy="572" rx="14" ry="7" fill="#8a9e7a" opacity="0.7" transform="rotate(-45 772 572)"/>
  <!-- Small berries -->
  <circle cx="24" cy="38" r="3" fill="#c0645a" opacity="0.8"/>
  <circle cx="776" cy="38" r="3" fill="#c0645a" opacity="0.8"/>
  <circle cx="24" cy="562" r="3" fill="#c0645a" opacity="0.8"/>
  <circle cx="776" cy="562" r="3" fill="#c0645a" opacity="0.8"/>
  <!-- Label -->
  <text x="400" y="586" text-anchor="middle"
    font-family="Georgia, serif" font-size="11" fill="#a09080" letter-spacing="3">✦ MEMOIRE ✦</text>
</svg>